<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FraudPulse{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root { --fp-accent: #6366f1; --fp-green: #22c55e; --fp-red: #ef4444; --fp-yellow: #eab308; --fp-blue: #3b82f6; }
        body { background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { background: #1e293b !important; border-bottom: 1px solid #334155; }
        .navbar-brand { font-weight: 700; color: var(--fp-accent) !important; font-size: 1.3rem; }
        .nav-link { color: #94a3b8 !important; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: #e2e8f0 !important; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; transition: transform .2s; }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--fp-accent); }
        .stat-value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
        .stat-label { color: #94a3b8; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
        .stat-icon { font-size: 2.5rem; opacity: .3; }
        .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; }
        .chart-card h5 { color: #e2e8f0; font-weight: 600; }
        .table-dark { --bs-table-bg: #1e293b; --bs-table-border-color: #334155; }
        .table-dark th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: .75rem; letter-spacing: .05em; }
        .badge-critical { background: #dc2626; }
        .badge-high { background: #ea580c; }
        .badge-medium { background: #ca8a04; }
        .badge-low { background: #16a34a; }
        .risk-bar { height: 6px; border-radius: 3px; background: #334155; overflow: hidden; }
        .risk-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
        .alert-row { border-left: 3px solid var(--fp-red); }
        .page-header { color: #f1f5f9; font-weight: 700; }
        .text-muted-custom { color: #64748b !important; }
        .btn-accent { background: var(--fp-accent); border-color: var(--fp-accent); color: #fff; }
        .btn-accent:hover { background: #4f46e5; border-color: #4f46e5; color: #fff; }
        .filter-bar { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem 1.5rem; }
        .form-select, .form-control { background: #0f172a; border-color: #334155; color: #e2e8f0; }
        .form-select:focus, .form-control:focus { background: #0f172a; border-color: var(--fp-accent); color: #e2e8f0; box-shadow: 0 0 0 .2rem rgba(99,102,241,.25); }
        .pipeline-step { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .pipeline-step h6 { color: #e2e8f0; font-weight: 600; }
        .output-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: .8rem; color: #a3e635; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .amount-inr::before { content: '₹'; }
        footer { border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check me-2"></i>FraudPulse</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'transactions' %}active{% endif %}" href="/transactions"><i class="bi bi-list-columns me-1"></i>Transactions</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'anomalies' %}active{% endif %}" href="/anomalies"><i class="bi bi-exclamation-triangle me-1"></i>Anomalies</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'merchants' %}active{% endif %}" href="/merchants"><i class="bi bi-shop me-1"></i>Merchants</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'customers' %}active{% endif %}" href="/customers"><i class="bi bi-people me-1"></i>Customers</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pipeline' %}active{% endif %}" href="/pipeline"><i class="bi bi-gear me-1"></i>Pipeline</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 mt-4">
        <small class="text-muted-custom">FraudPulse Data Platform · Real-time Fraud Detection Dashboard</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
